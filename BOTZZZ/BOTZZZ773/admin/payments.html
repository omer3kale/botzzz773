<!DOCTYPE html>
<html lang="en" class="admin-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Payments - BOTZZZ773 Admin</title>
    <link rel="stylesheet" href="../css/admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase JS Client for Real-time -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Admin Authentication Protection - MUST BE FIRST -->
    <script src="../js/admin-auth.js"></script>
    <!-- Supabase Client Initialization -->
    <script src="../js/supabase-client.js"></script>
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1494">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BOTZZZ773 Pro">

    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" sizes="72x72" href="/img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/img/icons/icon-512x512.png">

</head>
<body class="admin-body admin-payments-page">
    <main class="lightbox-main">
        <div class="lightbox-panel" data-popup-surface>
            <button type="button" class="lightbox-close" data-popup-close aria-label="Close admin payments window">
                <span aria-hidden="true">&times;</span>
            </button>

    <!-- Admin Header -->
    <header class="admin-header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="admin-logo">BOTZZZ773</div>
        <div class="admin-header-right">
            <div class="admin-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search by user..." id="paymentSearch">
            </div>
            <div class="admin-notifications">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">10</span>
            </div>
            <div class="admin-user-menu">
                <button class="admin-user-button" onclick="toggleUserMenu()">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=FF1494&color=000000" alt="Admin">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <div class="user-dropdown-header">
                        <div class="user-dropdown-info">
                            <strong id="adminUserName">Admin</strong>
                            <span id="adminUserEmail">admin@botzzz773.com</span>
                        </div>
                    </div>
                    <div class="user-dropdown-divider"></div>
                    <a href="settings.html" class="user-dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                    <a href="#" onclick="adminLogout(event)" class="user-dropdown-item logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <nav class="admin-nav">
            <a href="index.html" class="admin-nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="orders.html" class="admin-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
            </a>
            <a href="services.html" class="admin-nav-item">
                <i class="fas fa-box"></i>
                <span>Services</span>
            </a>
            <a href="payments.html" class="admin-nav-item active">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
            </a>
            <a href="tickets.html" class="admin-nav-item">
                <i class="fas fa-ticket-alt"></i>
                <span>Tickets</span>
                <span class="nav-badge">10</span>
            </a>
            <a href="reports.html" class="admin-nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="admin-nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <section class="admin-main" role="main">
        <div class="admin-page-header">
            <h1>Payments</h1>
            <div class="page-actions">
                <button class="btn-secondary" onclick="openExportPaymentsModal()">
                    <i class="fas fa-download"></i> Export
                </button>
                <button class="btn-primary" onclick="addPayment()">
                    <i class="fas fa-plus"></i> Add Payment
                </button>
            </div>
        </div>

        <div class="payments-layout no-quick-actions">
            <div class="payments-table-panel">
                <div class="table-container">
                    <table class="admin-table" id="paymentsTable">
                        <thead>
                            <tr>
                                <th><input type="checkbox" onclick="toggleAllPayments(this)" aria-label="Select all payments"></th>
                                <th onclick="sortTable('id')">ID <i class="fas fa-sort"></i></th>
                                <th>User</th>
                                <th onclick="sortTable('balance')">Balance <i class="fas fa-sort"></i></th>
                                <th onclick="sortTable('amount')">Amount <i class="fas fa-sort"></i></th>
                                <th>Method</th>
                                <th>Status</th>
                                <th>Fraud Risk</th>
                                <th>Memo</th>
                                <th onclick="sortTable('created')">Created <i class="fas fa-sort"></i></th>
                                <th>Updated</th>
                                <th>Mode</th>
                            </tr>
                        </thead>
                        <tbody id="paymentsTableBody">
                            <!-- Payments will be loaded dynamically from database -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="btn-secondary" id="prevPage" disabled>Previous</button>
            <span class="pagination-info" id="paginationInfo">Showing 0-0 of 0</span>
            <button class="btn-secondary" id="nextPage">Next</button>
        </div>
    </section>

        </div>
    </main>

    <!-- BOTZZZ773 Core Scripts -->
    <script src="../js/admin.js"></script>
    <script src="../js/admin-payments.js"></script>
    <script src="../js/botzzz773-realtime.js"></script>
    
    <!-- BOTZZZ773 Real-Time Integration -->
    <script>
        (function() {
            'use strict';
            
            console.log('[BOTZZZ773] Admin Payments real-time loading...');
            
            // Wait for Supabase ready
            document.addEventListener('supabase:ready', function() {
                if (typeof BOTZZZ773Realtime === 'undefined') {
                    console.warn('[BOTZZZ773] Realtime module not found');
                    return;
                }
                
                // Initialize real-time
                BOTZZZ773Realtime.init().then(function() {
                    console.log('[BOTZZZ773] Admin Payments real-time connected');
                    
                    // Subscribe to payment updates
                    BOTZZZ773Realtime.subscribeToPayments(function(data) {
                        console.log('[BOTZZZ773 Payments] Update:', data.type, data.record?.id);
                        if (typeof loadPayments === 'function') {
                            loadPayments();
                        }
                    });
                    
                    // Handle completed payments
                    BOTZZZ773Realtime.on('payments:completed', function(data) {
                        console.log('[BOTZZZ773 Payments] COMPLETED:', data.record?.transaction_id);
                    });
                    
                    // Handle failed payments
                    BOTZZZ773Realtime.on('payments:failed', function(data) {
                        console.log('[BOTZZZ773 Payments] FAILED:', data.record?.transaction_id);
                    });
                }).catch(function(err) {
                    console.warn('[BOTZZZ773] Payments real-time error:', err);
                });
            });
        })();
    </script>
    
    <!-- PWA Registration -->
    <script src="/js/pwa.js"></script>

</body>
</html>
