<!DOCTYPE html>
<html lang="en" class="admin-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Provider Dashboard - BOTZZZ773 Admin</title>
    <link rel="stylesheet" href="../css/admin-styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Admin Authentication Protection - MUST BE FIRST -->
    <script src="../js/admin-auth.js"></script>
    <!-- Supabase Client Initialization -->
    <script src="../js/supabase-client.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* ── NAV ── */
        .nav {
            background: linear-gradient(135deg, #111 0%, #1a1a2e 100%);
            border-bottom: 1px solid rgba(255,20,148,0.2);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-brand {
            font-size: 20px;
            font-weight: 700;
            color: #FF1494;
        }
        .nav-brand i { margin-right: 8px; }
        .nav-links a {
            color: #888;
            text-decoration: none;
            margin-left: 24px;
            font-size: 14px;
            transition: color 0.2s;
        }
        .nav-links a:hover, .nav-links a.active { color: #FF1494; }

        /* ── CONTAINER ── */
        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        /* ── HEADER ── */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 16px;
        }
        .page-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #FF1494, #FF69B4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-subtitle {
            color: #888;
            font-size: 14px;
            margin-top: 4px;
        }
        .header-actions { display: flex; gap: 12px; flex-wrap: wrap; }

        /* ── BUTTONS ── */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #FF1494, #e0007a);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(255,20,148,0.4); }
        .btn-danger {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: #fff;
        }
        .btn-danger:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(220,53,69,0.4); }
        .btn-outline {
            background: transparent;
            color: #FF1494;
            border: 1px solid rgba(255,20,148,0.3);
        }
        .btn-outline:hover { background: rgba(255,20,148,0.1); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none !important; }

        /* ── STAT CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: linear-gradient(145deg, #141422 0%, #1a1a2e 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
        }
        .stat-card.total::before { background: linear-gradient(90deg, #FF1494, #FF69B4); }
        .stat-card.active::before { background: linear-gradient(90deg, #00c853, #69f0ae); }
        .stat-card.deleted::before { background: linear-gradient(90deg, #dc3545, #ff6b6b); }
        .stat-card.unknown::before { background: linear-gradient(90deg, #ffc107, #ffdb4d); }

        .stat-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            margin-bottom: 16px;
        }
        .stat-card.total .stat-icon { background: rgba(255,20,148,0.15); color: #FF1494; }
        .stat-card.active .stat-icon { background: rgba(0,200,83,0.15); color: #00c853; }
        .stat-card.deleted .stat-icon { background: rgba(220,53,69,0.15); color: #dc3545; }
        .stat-card.unknown .stat-icon { background: rgba(255,193,7,0.15); color: #ffc107; }

        .stat-value {
            font-size: 32px;
            font-weight: 800;
            color: #fff;
            line-height: 1;
        }
        .stat-label {
            font-size: 13px;
            color: #888;
            margin-top: 6px;
        }

        /* ── LAST CHECK INFO ── */
        .last-check {
            background: rgba(255,20,148,0.05);
            border: 1px solid rgba(255,20,148,0.15);
            border-radius: 12px;
            padding: 14px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: #aaa;
        }
        .last-check i { color: #FF1494; }
        .last-check strong { color: #fff; }

        /* ── TABLE ── */
        .table-wrapper {
            background: linear-gradient(145deg, #141422 0%, #1a1a2e 100%);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px;
            overflow: hidden;
        }
        .table-header {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }
        .search-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 8px 14px;
            color: #fff;
            font-size: 13px;
            font-family: 'Inter', sans-serif;
            width: 240px;
            transition: border-color 0.2s;
        }
        .search-box:focus { outline: none; border-color: #FF1494; }
        .search-box::placeholder { color: #555; }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 14px 20px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #888;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        tbody td {
            padding: 14px 20px;
            font-size: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.03);
            vertical-align: middle;
        }
        tbody tr:hover { background: rgba(255,20,148,0.03); }
        tbody tr:last-child td { border-bottom: none; }

        .username-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .username-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(135deg, #FF1494, #FF69B4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }
        .username-text {
            font-weight: 600;
            color: #fff;
        }
        .username-text a {
            color: #fff;
            text-decoration: none;
        }
        .username-text a:hover { color: #FF1494; }
        .username-fullname {
            font-size: 12px;
            color: #666;
        }

        /* ── BADGES ── */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .badge-active { background: rgba(0,200,83,0.12); color: #69f0ae; }
        .badge-deleted { background: rgba(220,53,69,0.12); color: #ff6b6b; }
        .badge-unknown { background: rgba(255,193,7,0.12); color: #ffdb4d; }
        .badge-error { background: rgba(255,152,0,0.12); color: #ffb74d; }
        .badge-creating { background: rgba(33,150,243,0.12); color: #64b5f6; }
        .badge-done { background: rgba(0,200,83,0.12); color: #69f0ae; }

        .badge i { font-size: 8px; }

        .btn-sm {
            padding: 6px 12px;
            font-size: 11px;
            border-radius: 6px;
        }

        /* ── LOADING / EMPTY ── */
        .loading-state, .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .loading-state i, .empty-state i {
            font-size: 40px;
            margin-bottom: 16px;
            display: block;
        }
        .loading-state i { color: #FF1494; animation: spin 1s linear infinite; }
        .empty-state i { color: #333; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── TOAST ── */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            background: #1e1e3a;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 14px 20px;
            font-size: 13px;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
            animation: slideIn 0.3s ease;
            min-width: 280px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .toast.success { border-left: 3px solid #00c853; }
        .toast.error { border-left: 3px solid #dc3545; }
        .toast.info { border-left: 3px solid #FF1494; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── CONFIRM MODAL ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal {
            background: #1a1a2e;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 420px;
            width: 90%;
            text-align: center;
        }
        .modal h3 { color: #fff; font-size: 18px; margin-bottom: 12px; }
        .modal p { color: #888; font-size: 14px; margin-bottom: 24px; }
        .modal-actions { display: flex; gap: 12px; justify-content: center; }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            .container { padding: 20px 16px; }
            .page-title { font-size: 22px; }
            .stat-value { font-size: 26px; }
            .search-box { width: 100%; }
            .table-header { flex-direction: column; align-items: stretch; }
            table { display: block; overflow-x: auto; }
            .nav { padding: 12px 16px; }
        }
    </style>
</head>
<body>
    <!-- NAV -->
    <nav class="nav">
        <div class="nav-brand"><i class="fas fa-robot"></i> BOTZZZ773 Admin</div>
        <div class="nav-links">
            <a href="index.html">Dashboard</a>
            <a href="orders.html">Orders</a>
            <a href="services.html">Services</a>
            <a href="users.html">Users</a>
            <a href="provider-dashboard.html" class="active">Provider</a>
        </div>
    </nav>

    <div class="container">
        <!-- HEADER -->
        <div class="page-header">
            <div>
                <h1 class="page-title">Provider Dashboard</h1>
                <p class="page-subtitle">Instagram hesap yönetimi ve durum takibi</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" onclick="loadAccounts()">
                    <i class="fas fa-sync-alt"></i> Yenile
                </button>
                <button class="btn btn-danger" id="btnCleanup" onclick="confirmCleanup()">
                    <i class="fas fa-trash-alt"></i> Silinenleri Temizle
                </button>
            </div>
        </div>

        <!-- STATS -->
        <div class="stats-grid">
            <div class="stat-card total">
                <div class="stat-icon"><i class="fas fa-users"></i></div>
                <div class="stat-value" id="statTotal">-</div>
                <div class="stat-label">Toplam Hesap</div>
            </div>
            <div class="stat-card active">
                <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
                <div class="stat-value" id="statActive">-</div>
                <div class="stat-label">Aktif</div>
            </div>
            <div class="stat-card deleted">
                <div class="stat-icon"><i class="fas fa-ban"></i></div>
                <div class="stat-value" id="statDeleted">-</div>
                <div class="stat-label">Silinmiş</div>
            </div>
            <div class="stat-card unknown">
                <div class="stat-icon"><i class="fas fa-question-circle"></i></div>
                <div class="stat-value" id="statUnknown">-</div>
                <div class="stat-label">Kontrol Edilmemiş</div>
            </div>
        </div>

        <!-- LAST CHECK -->
        <div class="last-check" id="lastCheck" style="display:none;">
            <i class="fas fa-clock"></i>
            <span>Son kontrol: <strong id="lastCheckTime">-</strong></span>
        </div>

        <!-- TABLE -->
        <div class="table-wrapper">
            <div class="table-header">
                <span class="table-title"><i class="fas fa-instagram" style="color:#FF1494;margin-right:8px;"></i>Hesaplar</span>
                <input type="text" class="search-box" id="searchBox" placeholder="Hesap ara..." oninput="filterTable()">
            </div>
            <div id="tableContent">
                <div class="loading-state">
                    <i class="fas fa-spinner"></i>
                    <p>Hesaplar yükleniyor...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- CONFIRM MODAL -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <h3 id="modalTitle">Emin misiniz?</h3>
            <p id="modalText">Bu işlem geri alınamaz.</p>
            <div class="modal-actions">
                <button class="btn btn-outline" onclick="closeModal()">İptal</button>
                <button class="btn btn-danger" id="modalConfirmBtn">Onayla</button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/.netlify/functions/ig-accounts';
        let allAccounts = [];

        // ─── LOAD ACCOUNTS ───
        async function loadAccounts() {
            const el = document.getElementById('tableContent');
            el.innerHTML = '<div class="loading-state"><i class="fas fa-spinner"></i><p>Hesaplar yükleniyor...</p></div>';

            try {
                const res = await fetch(API_BASE);
                const data = await res.json();

                if (!data.success) throw new Error(data.error || 'API hatası');

                allAccounts = data.accounts || [];
                const stats = data.stats || {};

                // Update stats
                document.getElementById('statTotal').textContent = stats.total || 0;
                document.getElementById('statActive').textContent = stats.active || 0;
                document.getElementById('statDeleted').textContent = stats.deleted || 0;
                document.getElementById('statUnknown').textContent = stats.unknown || 0;

                // Last check
                const lastChecked = allAccounts.find(a => a.ig_checked_at);
                if (lastChecked) {
                    document.getElementById('lastCheck').style.display = 'flex';
                    document.getElementById('lastCheckTime').textContent = lastChecked.ig_checked_at;
                }

                renderTable(allAccounts);
            } catch (err) {
                el.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Yüklenemedi: ${err.message}</p></div>`;
                showToast('Hesaplar yüklenemedi: ' + err.message, 'error');
            }
        }

        // ─── RENDER TABLE ───
        function renderTable(accounts) {
            const el = document.getElementById('tableContent');

            if (!accounts.length) {
                el.innerHTML = '<div class="empty-state"><i class="fas fa-inbox"></i><p>Henüz hesap yok</p></div>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Kullanıcı Adı</th>
                        <th>Email</th>
                        <th>Cinsiyet</th>
                        <th>DB Durum</th>
                        <th>IG Durum</th>
                        <th>Son Kontrol</th>
                        <th>Oluşturulma</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>`;

            accounts.forEach((acc, i) => {
                const initials = (acc.full_name || acc.username || '?').substring(0, 2).toUpperCase();
                const igBadge = getIgBadge(acc.ig_status);
                const dbBadge = getDbBadge(acc.status);
                const gender = acc.gender === 'male' ? '♂️' : acc.gender === 'female' ? '♀️' : '-';
                const created = acc.created_at ? new Date(acc.created_at).toLocaleDateString('tr-TR') : '-';
                const checked = acc.ig_checked_at || '-';

                html += `<tr>
                    <td style="color:#555;">${i + 1}</td>
                    <td>
                        <div class="username-cell">
                            <div class="username-avatar">${initials}</div>
                            <div>
                                <div class="username-text">
                                    <a href="https://instagram.com/${acc.username}" target="_blank">${acc.username}</a>
                                </div>
                                <div class="username-fullname">${acc.full_name || '-'}</div>
                            </div>
                        </div>
                    </td>
                    <td style="color:#888;font-size:12px;">${acc.email || '-'}</td>
                    <td>${gender}</td>
                    <td>${dbBadge}</td>
                    <td>${igBadge}</td>
                    <td style="color:#666;font-size:12px;">${checked}</td>
                    <td style="color:#666;font-size:12px;">${created}</td>
                    <td>
                        <button class="btn btn-danger btn-sm" onclick="confirmDelete('${acc.username}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`;
            });

            html += '</tbody></table>';
            el.innerHTML = html;
        }

        // ─── BADGES ───
        function getIgBadge(status) {
            switch (status) {
                case 'active': return '<span class="badge badge-active"><i class="fas fa-circle"></i> Aktif</span>';
                case 'deleted': return '<span class="badge badge-deleted"><i class="fas fa-circle"></i> Silinmiş</span>';
                case 'error': return '<span class="badge badge-error"><i class="fas fa-circle"></i> Hata</span>';
                case 'unknown': return '<span class="badge badge-unknown"><i class="fas fa-circle"></i> Belirsiz</span>';
                default: return '<span class="badge badge-unknown"><i class="fas fa-circle"></i> Kontrol Edilmedi</span>';
            }
        }

        function getDbBadge(status) {
            switch (status) {
                case 'done': return '<span class="badge badge-done"><i class="fas fa-circle"></i> Tamamlandı</span>';
                case 'creating': return '<span class="badge badge-creating"><i class="fas fa-circle"></i> Oluşturuluyor</span>';
                case 'error': return '<span class="badge badge-error"><i class="fas fa-circle"></i> Hata</span>';
                default: return '<span class="badge badge-unknown"><i class="fas fa-circle"></i> ' + (status || '-') + '</span>';
            }
        }

        // ─── SEARCH / FILTER ───
        function filterTable() {
            const q = document.getElementById('searchBox').value.toLowerCase().trim();
            if (!q) { renderTable(allAccounts); return; }
            const filtered = allAccounts.filter(a =>
                (a.username || '').toLowerCase().includes(q) ||
                (a.full_name || '').toLowerCase().includes(q) ||
                (a.email || '').toLowerCase().includes(q)
            );
            renderTable(filtered);
        }

        // ─── DELETE SINGLE ───
        function confirmDelete(username) {
            document.getElementById('modalTitle').textContent = 'Hesabı Sil';
            document.getElementById('modalText').textContent = `"${username}" hesabını veritabanından silmek istediğinize emin misiniz?`;
            document.getElementById('modalConfirmBtn').onclick = () => deleteAccount(username);
            document.getElementById('confirmModal').classList.add('show');
        }

        async function deleteAccount(username) {
            closeModal();
            try {
                const res = await fetch(API_BASE, {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${username} silindi`, 'success');
                    loadAccounts();
                } else {
                    showToast('Hata: ' + (data.error || 'Bilinmeyen'), 'error');
                }
            } catch (err) {
                showToast('Silme hatası: ' + err.message, 'error');
            }
        }

        // ─── CLEANUP ───
        function confirmCleanup() {
            const deletedCount = allAccounts.filter(a => a.ig_status === 'deleted').length;
            if (deletedCount === 0) {
                showToast('Silinecek hesap yok', 'info');
                return;
            }
            document.getElementById('modalTitle').textContent = 'Toplu Temizlik';
            document.getElementById('modalText').textContent = `Instagram\'da silinmiş olarak işaretlenen ${deletedCount} hesap veritabanından kaldırılacak. Emin misiniz?`;
            document.getElementById('modalConfirmBtn').onclick = doCleanup;
            document.getElementById('confirmModal').classList.add('show');
        }

        async function doCleanup() {
            closeModal();
            try {
                const res = await fetch(API_BASE, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'cleanup' })
                });
                const data = await res.json();
                if (data.success) {
                    showToast(`${data.deleted_count} hesap temizlendi`, 'success');
                    loadAccounts();
                } else {
                    showToast('Hata: ' + (data.error || 'Bilinmeyen'), 'error');
                }
            } catch (err) {
                showToast('Temizlik hatası: ' + err.message, 'error');
            }
        }

        // ─── MODAL ───
        function closeModal() {
            document.getElementById('confirmModal').classList.remove('show');
        }

        // ─── TOAST ───
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast ' + type;
            const icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-times-circle' : 'fa-info-circle';
            toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 4000);
        }

        // ─── INIT ───
        document.addEventListener('DOMContentLoaded', loadAccounts);
    </script>
</body>
</html>
