<!DOCTYPE html>
<html lang="en" class="admin-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tickets - BOTZZZ773 Admin</title>
    <link rel="stylesheet" href="../css/admin-styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase JS Client for Real-time -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Admin Authentication Protection - MUST BE FIRST -->
    <script src="../js/admin-auth.js"></script>
    <!-- Supabase Client Initialization -->
    <script src="../js/supabase-client.js"></script>
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1494">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BOTZZZ773 Pro">

    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" sizes="72x72" href="/img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/img/icons/icon-512x512.png">

</head>
<body class="admin-body admin-tickets-page">
    <main class="lightbox-main">
        <div class="lightbox-panel" data-popup-surface>
            <button type="button" class="lightbox-close" data-popup-close aria-label="Close admin tickets window">
                <span aria-hidden="true">&times;</span>
            </button>

    <!-- Admin Header -->
    <header class="admin-header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="admin-logo">BOTZZZ773</div>
        <div class="admin-header-right">
            <div class="admin-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search by Ticket ID..." id="ticketSearch">
            </div>
            <div class="admin-notifications">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">10</span>
            </div>
            <div class="admin-user-menu">
                <button class="admin-user-button" onclick="toggleUserMenu()">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=FF1494&color=000000" alt="Admin">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <div class="user-dropdown-header">
                        <div class="user-dropdown-info">
                            <strong id="adminUserName">Admin</strong>
                            <span id="adminUserEmail">admin@botzzz773.com</span>
                        </div>
                    </div>
                    <div class="user-dropdown-divider"></div>
                    <a href="settings.html" class="user-dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                    <a href="#" onclick="adminLogout(event)" class="user-dropdown-item logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <nav class="admin-nav">
            <a href="index.html" class="admin-nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="orders.html" class="admin-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
            </a>
            <a href="services.html" class="admin-nav-item">
                <i class="fas fa-box"></i>
                <span>Services</span>
            </a>
            <a href="payments.html" class="admin-nav-item">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
            </a>
            <a href="refunds.html" class="admin-nav-item">
                <i class="fas fa-rotate-left"></i>
                <span>Refunds</span>
            </a>
            <a href="tickets.html" class="admin-nav-item active">
                <i class="fas fa-ticket-alt"></i>
                <span>Tickets</span>
                <span class="nav-badge" id="adminSidebarTicketBadge" style="display:none"></span>
            </a>
            <a href="reports.html" class="admin-nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="admin-nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <section class="admin-main" role="main">
        <div class="admin-page-header">
            <h1>Support Tickets</h1>
            <div class="page-actions">
                <!-- Bulk Actions Dropdown -->
                <div class="bulk-actions-container" id="bulkActionsContainer" style="position: relative; display: none;">
                    <button class="btn-secondary" id="bulkActionsBtn" onclick="toggleBulkActionsMenu()">
                        <i class="fas fa-cogs"></i> Actions
                    </button>
                    <div class="bulk-actions-menu" id="bulkActionsMenu" style="display: none; position: absolute; top: 100%; right: 140px; background: #1f2937; border: 1px solid #374151; border-radius: 4px; z-index: 1000; min-width: 150px; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                        <button type="button" class="bulk-action-item" onclick="openBulkReplyModal()" style="display: block; width: 100%; padding: 12px 16px; text-align: left; background: none; border: none; color: #e5e7eb; cursor: pointer; font-size: 13px; border-bottom: 1px solid #374151;">
                            <i class="fas fa-reply"></i> Reply All
                        </button>
                        <button type="button" class="bulk-action-item" onclick="closeBulkTickets()" style="display: block; width: 100%; padding: 12px 16px; text-align: left; background: none; border: none; color: #e5e7eb; cursor: pointer; font-size: 13px; border-bottom: 1px solid #374151;">
                            <i class="fas fa-times-circle"></i> Close All
                        </button>
                        <button type="button" class="bulk-action-item" onclick="deleteBulkTickets()" style="display: block; width: 100%; padding: 12px 16px; text-align: left; background: none; border: none; color: #ef4444; cursor: pointer; font-size: 13px;">
                            <i class="fas fa-trash"></i> Delete All
                        </button>
                    </div>
                </div>
                <button class="btn-secondary" onclick="triggerTicketsRefresh()">
                    <i class="fas fa-sync-alt"></i> Refresh
                </button>
                <button class="btn-primary" onclick="addTicket()">
                    <i class="fas fa-plus"></i> Add Ticket
                </button>
            </div>
        </div>

        <div class="tickets-layout no-quick-actions">
            <div class="tickets-table-panel">
                <div class="table-container">
                    <table class="admin-table" id="ticketsTable">
                        <thead>
                            <tr>
                                <th><input type="checkbox" onclick="toggleAllTickets(this)" aria-label="Select all tickets"></th>
                                <th>User</th>
                                <th>Subject</th>
                                <th>Status</th>
                                <th onclick="sortTable('created')">Created <i class="fas fa-sort"></i></th>
                                <th>Last Update</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="ticketsTableBody">
                            <!-- Tickets will be loaded dynamically from database -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="pagination">
            <button class="btn-secondary" id="prevPage" disabled>Previous</button>
            <span class="pagination-info" id="paginationInfo">Loading...</span>
            <button class="btn-secondary" id="nextPage">Next</button>
        </div>
    </section>

        </div>
    </main>

    <!-- BOTZZZ773 Core Scripts -->
    <script src="../js/admin.js"></script>
    <script src="../js/admin-tickets.js"></script>
    <script src="../js/botzzz773-realtime.js"></script>
    
    <!-- BOTZZZ773 Real-Time Integration -->
    <script>
        (function() {
            'use strict';
            
            console.log('[BOTZZZ773] Admin Tickets real-time loading...');
            
            // Wait for Supabase ready
            document.addEventListener('supabase:ready', function() {
                if (typeof BOTZZZ773Realtime === 'undefined') {
                    console.warn('[BOTZZZ773] Realtime module not found');
                    return;
                }
                
                // Initialize real-time
                BOTZZZ773Realtime.init().then(function() {
                    console.log('[BOTZZZ773] Admin Tickets real-time connected');
                    
                    // Subscribe to ticket updates
                    BOTZZZ773Realtime.subscribeToTickets(function(data) {
                        console.log('[BOTZZZ773 Tickets] Update:', data.type, data.record?.id);
                        if (typeof loadTickets === 'function') {
                            loadTickets();
                        }
                    });
                    
                    // Handle new ticket notifications
                    BOTZZZ773Realtime.on('tickets:change', function(data) {
                        if (data.type === 'INSERT') {
                            console.log('[BOTZZZ773 Tickets] NEW TICKET:', data.record?.ticket_number);
                        }
                    });
                }).catch(function(err) {
                    console.warn('[BOTZZZ773] Tickets real-time error:', err);
                });
            });
        })();
    </script>
    
    <!-- PWA Registration -->
    <script src="/js/pwa.js"></script>

</body>
</html>
