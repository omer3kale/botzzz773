<!DOCTYPE html>
<html lang="en" class="admin-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Refunds - BOTZZZ773 Admin</title>
    <link rel="stylesheet" href="../css/admin-styles.css">
            <style>
                /* Refunds table column tweaks */
                .admin-table th.col-reason, .admin-table td.col-reason {
                    text-align: left;
                    white-space: normal;
                    word-break: break-word;
                    min-width: 260px;
                }
                .admin-table td.col-source {
                    white-space: nowrap;
                }
                /* Make table layout fixed so widths apply predictably */
                #refundsTable { table-layout: fixed; width: 100%; }
                /* Narrow some columns to free room for Reason */
                .admin-table th:nth-child(1), .admin-table td:nth-child(1) { width: 44px; }
                .admin-table th:nth-child(2), .admin-table td:nth-child(2) { width: 18%; }
                .admin-table th:nth-child(3), .admin-table td:nth-child(3) { width: 12%; }
                .admin-table th:nth-child(4), .admin-table td:nth-child(4) { width: 10%; }
                /* Reason gets more space; Source stays compact */
                .admin-table th:nth-child(6), .admin-table td:nth-child(6) { width: 22%; }
                .admin-table th:nth-child(7), .admin-table td:nth-child(7) { width: 10%; }
                .admin-table th:nth-child(8), .admin-table td:nth-child(8) { width: 11%; }
                .admin-table th:nth-child(9), .admin-table td:nth-child(9) { width: 8%; }
                .admin-table th:nth-child(10), .admin-table td:nth-child(10) { width: 7%; }
            </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Supabase JS Client for Real-time -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- Admin Authentication Protection - MUST BE FIRST -->
    <script src="../js/admin-auth.js"></script>
    <!-- Supabase Client Initialization -->
    <script src="../js/supabase-client.js"></script>
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1494">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BOTZZZ773 Pro">

    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" sizes="72x72" href="/img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/img/icons/icon-512x512.png">

</head>
<body class="admin-body admin-refunds-page">
    <main class="lightbox-main">
        <div class="lightbox-panel" data-popup-surface>
            <button type="button" class="lightbox-close" data-popup-close aria-label="Close admin refunds window">
                <span aria-hidden="true">&times;</span>
            </button>

    <!-- Admin Header -->
    <header class="admin-header">
        <button class="sidebar-toggle" onclick="toggleSidebar()">
            <i class="fas fa-bars"></i>
        </button>
        <div class="admin-logo">BOTZZZ773</div>
        <div class="admin-header-right">
            <div class="admin-search">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Kullanıcı veya order ara..." id="refundSearch">
            </div>
            <div class="admin-notifications">
                <i class="fas fa-bell"></i>
                <span class="notification-badge">10</span>
            </div>
            <div class="admin-user-menu">
                <button class="admin-user-button" onclick="toggleUserMenu()">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=FF1494&color=000000" alt="Admin">
                    <i class="fas fa-chevron-down"></i>
                </button>
                <div class="user-dropdown-menu" id="userDropdownMenu">
                    <div class="user-dropdown-header">
                        <div class="user-dropdown-info">
                            <strong id="adminUserName">Admin</strong>
                            <span id="adminUserEmail">admin@botzzz773.com</span>
                        </div>
                    </div>
                    <div class="user-dropdown-divider"></div>
                    <a href="settings.html" class="user-dropdown-item">
                        <i class="fas fa-cog"></i>
                        <span>Settings</span>
                    </a>
                    <a href="#" onclick="adminLogout(event)" class="user-dropdown-item logout">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Admin Sidebar -->
    <aside class="admin-sidebar" id="adminSidebar">
        <nav class="admin-nav">
            <a href="index.html" class="admin-nav-item">
                <i class="fas fa-chart-line"></i>
                <span>Dashboard</span>
            </a>
            <a href="users.html" class="admin-nav-item">
                <i class="fas fa-users"></i>
                <span>Users</span>
            </a>
            <a href="orders.html" class="admin-nav-item">
                <i class="fas fa-shopping-cart"></i>
                <span>Orders</span>
            </a>
            <a href="services.html" class="admin-nav-item">
                <i class="fas fa-box"></i>
                <span>Services</span>
            </a>
            <a href="payments.html" class="admin-nav-item">
                <i class="fas fa-credit-card"></i>
                <span>Payments</span>
            </a>
            <a href="refunds.html" class="admin-nav-item active">
                <i class="fas fa-rotate-left"></i>
                <span>Refunds</span>
            </a>
            <a href="tickets.html" class="admin-nav-item">
                <i class="fas fa-ticket-alt"></i>
                <span>Tickets</span>
                <span class="nav-badge">10</span>
            </a>
            <a href="reports.html" class="admin-nav-item">
                <i class="fas fa-chart-bar"></i>
                <span>Reports</span>
            </a>
            <a href="settings.html" class="admin-nav-item">
                <i class="fas fa-cog"></i>
                <span>Settings</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <section class="admin-main" role="main">
        <div class="admin-page-header">
            <h1>Refunds</h1>
            <div class="page-actions">
                <button class="btn-secondary" onclick="refreshRefunds()">
                    <i class="fas fa-rotate"></i> Yenile
                </button>
            </div>
        </div>

        <div class="payments-layout no-quick-actions">
            <div class="payments-table-panel">
                <div class="table-container">
                    <table class="admin-table" id="refundsTable">
                        <thead>
                            <tr>
                                <th><input type="checkbox" onclick="toggleAllRefunds(this)" aria-label="Select all refunds"></th>
                                <th>User</th>
                                <th>Order ID</th>
                                <th>Total Amount</th>
                                <th>Amount</th>
                                <th class="col-reason">Reason</th>
                                <th>Source</th>
                                <th>Created</th>
                                <th>Refund Applied</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="refundsTableBody">
                            <!-- Refunds will be loaded dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Pagination placeholder (future) -->
        <div class="pagination">
            <span class="pagination-info" id="refundsPaginationInfo">Showing latest 500 refunds</span>
        </div>
    </section>

        </div>
    </main>

    <!-- BOTZZZ773 Core Scripts -->
    <script src="../js/admin.js"></script>
    <script src="../js/admin-refunds.js"></script>
    <script src="../js/botzzz773-realtime.js"></script>
    <!-- PWA Registration -->
    <script src="/js/pwa.js"></script>

</body>
</html>
