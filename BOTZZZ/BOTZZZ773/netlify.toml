# Netlify Configuration
[build]
  publish = "."
  command = "echo Build complete - static site"
  
[build.environment]
  SECRETS_SCAN_ENABLED = "false"
  NODE_VERSION = "18"
  NETLIFY_BUILD_DEBUG = "true"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js", "stripe", "axios"]

[dev]
  framework = "#static"
  port = 8888
  functions = "netlify/functions"
  publish = "."
  targetPort = 3999

# API v2 endpoint - JSON endpoint for providers (main endpoint)
[[redirects]]
  from = "/v2"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

# API v2 endpoint - also available at /api/v2 for compatibility
[[redirects]]
  from = "/api/v2"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

[[redirects]]
  from = "/api/v2/*"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

# API documentation page - /api shows api.html
[[redirects]]
  from = "/api"
  to = "/api.html"
  status = 200
  force = false

# Fallback for panels using /v2 (without /api prefix)
[[redirects]]
  from = "/v2"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

# Trailing slash variants
[[redirects]]
  from = "/api/v2/*"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

[[redirects]]
  from = "/v2/*"
  to = "/.netlify/functions/v2"
  status = 200
  force = true

# SMM Bridge — Twitter bot provider API (replaces ngrok + smm_bridge.py)
[[redirects]]
  from = "/smm-bridge"
  to = "/.netlify/functions/smm-bridge"
  status = 200
  force = true

[[redirects]]
  from = "/smm-bridge/*"
  to = "/.netlify/functions/smm-bridge"
  status = 200
  force = true

# Order status sync - runs every 5 minutes
[functions.order-status-sync]
  schedule = "*/5 * * * *"

# Provider balance sync - runs every 2 hours to check balances and send alerts
[functions.scheduled-provider-sync]
  schedule = "0 */2 * * *"

# Provider service sync - hourly to refresh prices with markup preserved
[functions.sync-service-catalog]
  schedule = "0 */3 * * *"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Don't cache HTML files
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Scheduled function: Refill status sync every 4 hours
[functions."refill-status-sync"]
  schedule = "0 */4 * * *"
