<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Loading Test</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            margin: 0;
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
        }

        .diagnostic-shell {
            padding: 40px 24px;
            max-width: 840px;
            margin: 0 auto;
        }

        .diagnostic-shell h1 {
            color: #60a5fa;
            margin-bottom: 8px;
            font-size: 28px;
        }

        .diagnostic-shell p.lead {
            margin: 0 0 24px;
            color: rgba(226, 232, 240, 0.8);
        }

        .test-box {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.4);
        }

        .test-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .test-button {
            background: #3b82f6;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .test-button:hover:not(:disabled) {
            background: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
        }

        .test-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .results-log {
            min-height: 140px;
        }

        .results-log p {
            margin: 6px 0;
        }

        .results-log pre {
            background: #0f172a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin-top: 12px;
        }

        .success { color: #10b981; }
        .error { color: #ef4444; }
        .info { color: #60a5fa; }
    </style>
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1494">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BOTZZZ773 Pro">

    <!-- Icons for iOS -->
    <link rel="apple-touch-icon" sizes="72x72" href="/img/icons/icon-72x72.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/img/icons/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/img/icons/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/img/icons/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/img/icons/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="192x192" href="/img/icons/icon-192x192.png">
    <link rel="apple-touch-icon" sizes="384x384" href="/img/icons/icon-384x384.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/img/icons/icon-512x512.png">

</head>
<body>
    <main class="lightbox-main">
        <div class="lightbox-panel" data-popup-surface>
            <button type="button" class="lightbox-close" data-popup-close aria-label="Close services diagnostic window">
                <span aria-hidden="true">&times;</span>
            </button>

            <div class="diagnostic-shell">
                <header>
                    <h1>🔍 Service Loading Diagnostic</h1>
                    <p class="lead">Run Fetch and XHR checks against the services function to verify latency and payload health.</p>
                </header>

                <div class="test-box">
                    <h2>Test Controls</h2>
                    <div class="test-controls">
                        <button type="button" class="test-button" data-diagnostic="fetch">Run Fetch API Test</button>
                        <button type="button" class="test-button" data-diagnostic="xhr">Run XMLHttpRequest Test</button>
                        <button type="button" class="test-button" data-diagnostic="clear">Clear Results</button>
                    </div>
                </div>

                <div class="test-box">
                    <h2>Results</h2>
                    <div id="results" class="results-log" aria-live="polite"></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script src="js/test-services.js"></script>
    <!-- PWA Registration -->
    <script src="/js/pwa.js"></script>

</body>
</html>
