<!DOCTYPE html>
<html>
<head><title>Discount Test</title></head>
<body>
<h2>User Discount Test</h2>
<div id="output"></div>
<button onclick="testDiscount()">Test with 15% Discount</button>
<button onclick="clearDiscount()">Clear Discount</button>
<button onclick="checkUser()">Check Current User</button>

<script>
function testDiscount() {
    let user = JSON.parse(localStorage.getItem('user') || '{}');
    user.discount_rate = 15;
    localStorage.setItem('user', JSON.stringify(user));
    document.getElementById('output').innerHTML = '<p style="color:green;"> Set discount_rate to 15%. Reloading services page...</p>';
    setTimeout(() => window.location.href = '/services.html', 1000);
}

function clearDiscount() {
    let user = JSON.parse(localStorage.getItem('user') || '{}');
    delete user.discount_rate;
    localStorage.setItem('user', JSON.stringify(user));
    document.getElementById('output').innerHTML = '<p style="color:orange;"> Cleared discount_rate. Reloading...</p>';
    setTimeout(() => window.location.href = '/services.html', 1000);
}

function checkUser() {
    let user = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('output').innerHTML = '<pre>' + JSON.stringify(user, null, 2) + '</pre>';
}
</script>
</body>
</html>
